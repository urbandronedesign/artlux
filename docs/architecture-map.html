<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>ArtLux Architecture</title>
<style>
:root {
  --bg: #0a0a0a; --s1: #141414; --s2: #1c1c1c; --line: #383838;
  --t1: #e8e8e8; --t2: #9a9a9a; --t3: #8a8a8a; --accent: #27b6c4;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--t1); font-family: var(--sans); overflow: hidden; }
svg#map { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
svg#map.dragging { cursor: grabbing; }
#bar { position: fixed; left: 16px; right: 16px; top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#bar > * { pointer-events: auto; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: 6px; }
.brand span { color: var(--accent); }
.chip { background: rgba(20,20,20,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--t2); backdrop-filter: blur(6px); }
.chip b { color: var(--t1); font-weight: 600; }
button { font: inherit; font-size: 13px; color: var(--t1); background: rgba(28,28,28,.95); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: rgba(39,182,196,.18); border-color: var(--accent); color: #bff3f8; }
input#q { font: inherit; font-size: 13px; color: var(--t1); background: rgba(20,20,20,.95); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 210px; }
input#q:focus { outline: none; border-color: var(--accent); }
#levels { display: flex; gap: 4px; }
#help { position: fixed; left: 16px; bottom: 14px; font-size: 12px; color: var(--t3); background: rgba(10,10,10,.8); padding: 6px 10px; border-radius: 8px; }
#legend { position: fixed; right: 16px; bottom: 14px; font-size: 12px; color: var(--t2); background: rgba(20,20,20,.92); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 5px; max-width: 260px; }
#legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
@media (max-width: 700px) { #legend { display: none; } input#q { width: 140px; } #help { display: none; } }
/* SVG text */
text { font-family: var(--sans); fill: var(--t1); }
.mono { font-family: var(--mono); }
.lvl { transition: opacity .18s linear; }
.hit rect.mod { stroke: #fff !important; stroke-width: 2.5 !important; }
</style>
</head>

<div id="bar">
  <div class="brand">Art<span>Lux</span> architecture</div>
  <div class="chip" id="levelChip">Level <b>1</b> of 4 · processes</div>
  <div id="levels">
    <button data-l="1">1 Processes</button><button data-l="2">2 Subsystems</button>
    <button data-l="3">3 Modules</button><button data-l="4">4 Roles + rules</button>
  </div>
  <button id="fit">Fit</button>
  <input id="q" placeholder="Find a module… (Enter)" autocomplete="off">
</div>
<div id="help">Scroll or pinch to zoom · drag to pan · keys 1–4 jump to a level · 0 fits</div>
<div id="legend">
  <div><i style="border-color:#27b6c4"></i>Frame / output path</div>
  <div><i style="border-color:#e3b341"></i>Video into the app</div>
  <div><i style="border-color:#8b8bf0"></i>IPC / MessagePort</div>
  <div><i style="border-color:#9a9a9a;border-top-style:dashed"></i>Control &amp; files</div>

// ─────────────────────────────────────────────────────────────────────────────────────────────────

const NS = 'http://www.w3.org/2000/svg';
const world = document.getElementById('world');
const svg = document.getElementById('map');
const F = { region: 80, regionSub: 40, summary: 40, group: 30, mod: 16, role: 11.5, rule: 13, edge: 38 };
const PAD = 26, HEAD = 160, GHEAD = 50, GAP = 22, MOD_GAP = 8;
// Level-1 one-sentence summaries, shown inside each process box until the subsystems fade in.
const SUMMARY = {
  main: 'Owns the operating system: files, network and native addons. Sends LED data out, opens every window, and keeps an unattended show alive.',
  preload: 'The only door between the page and Node: one typed API plus relays.',
  shared: 'The types and contracts all three processes agree on.',

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || world).appendChild(e);
  return e;
}
/** Greedy word wrap by an approximate glyph width. */
function wrap(text, width, size) {
  const max = Math.max(8, Math.floor(width / (size * 0.53)));
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

const layer = { 1: el('g', { class: 'lvl', 'data-lv': 1 }), 2: el('g', { class: 'lvl', 'data-lv': 2 }), 3: el('g', { class: 'lvl', 'data-lv': 3 }), 4: el('g', { class: 'lvl', 'data-lv': 4 }) };
const edgeLayer = el('g', {});
world.insertBefore(edgeLayer, world.firstChild);
const rects = {};      // id -> {x,y,w,h}
const modIndex = [];   // for search: {name, x, y, w, h, g}

function layoutRegion(r, y0) {
  const innerW = r.w - PAD * 2, colW = (innerW - GAP * (r.cols - 1)) / r.cols;
  const colH = new Array(r.cols).fill(0);
  const placed = [];
  for (const g of r.groups) {
    // module rows: name line + wrapped role lines
    const rows = g.m.map(([name, role]) => {
      const lines = wrap(role, colW - 34, F.role);
      return { name, lines, h: 30 + lines.length * (F.role * 1.3) + 8 };
    });
    const h = GHEAD + rows.reduce((s, x) => s + x.h + MOD_GAP, 0) + 10;
    const c = colH.indexOf(Math.min(...colH));
    placed.push({ g, rows, x: r.x + PAD + c * (colW + GAP), y: y0 + HEAD + colH[c], w: colW, h });
    colH[c] += h + GAP;
  }
  const rulesLines = (r.rules || []).map((t) => wrap('• ' + t, innerW - 20, F.rule));
  const rulesH = rulesLines.reduce((s, l) => s + l.length * F.rule * 1.35 + 6, 0);
  const h = HEAD + Math.max(...colH) + (rulesH ? rulesH + 24 : 0) + PAD;
  return { placed, h, rulesLines, rulesY: y0 + HEAD + Math.max(...colH) + 6 };
}

function drawRegion(r, y0) {
  const L = layoutRegion(r, y0);
  rects[r.id] = { x: r.x, y: y0, w: r.w, h: L.h };
  // level 1: the process box itself
  el('rect', { x: r.x, y: y0, width: r.w, height: L.h, rx: 28, fill: r.color + '14', stroke: r.color, 'stroke-width': 3 });
  // Titles shrink to fit a narrow box rather than spilling out of it.
  const titleSize = Math.min(F.region, (r.w - PAD * 2) / (r.title.length * 0.58));
  const subSize = Math.min(F.regionSub, (r.w - PAD * 2) / (r.sub.length * 0.5));
  el('text', { x: r.x + PAD, y: y0 + 84, 'font-size': titleSize, 'font-weight': 700, fill: r.color }).textContent = r.title;
  el('text', { x: r.x + PAD, y: y0 + 136, 'font-size': subSize, fill: '#b5b5b5' }).textContent = r.sub;
  // level 1 only: one sentence saying what this process is FOR
  wrap(SUMMARY[r.id] || '', r.w - PAD * 2, F.summary).forEach((ln, i) => {
    el('text', { x: r.x + PAD, y: y0 + HEAD + 60 + i * F.summary * 1.3, 'font-size': F.summary, fill: '#d6d6d6' }, layer[1]).textContent = ln;
  });
  for (const p of L.placed) {
    // level 2: subsystem boxes
    el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 14, fill: '#161616', stroke: r.color + '88', 'stroke-width': 1.6 }, layer[2]);
    el('text', { x: p.x + 16, y: p.y + 34, 'font-size': F.group, 'font-weight': 650, fill: '#e8e8e8' }, layer[2]).textContent = p.g.t;
    let my = p.y + GHEAD;
    for (const row of p.rows) {
      // level 3: module chips + names
      const chip = el('g', {}, layer[3]);
      el('rect', { class: 'mod', x: p.x + 12, y: my, width: p.w - 24, height: row.h, rx: 8, fill: '#1e1e1e', stroke: '#2f2f2f', 'stroke-width': 1 }, chip);
      el('text', { x: p.x + 24, y: my + 21, 'font-size': F.mod, 'font-weight': 600, class: 'mono', fill: r.color }, chip).textContent = row.name;
      modIndex.push({ name: row.name.toLowerCase(), x: p.x + 12, y: my, w: p.w - 24, h: row.h, g: chip });
      // level 4: the role, wrapped
      row.lines.forEach((ln, i) => {
        el('text', { x: p.x + 24, y: my + 38 + i * F.role * 1.3, 'font-size': F.role, fill: '#a8a8a8' }, layer[4]).textContent = ln;
      });
      my += row.h + MOD_GAP;
    }
  }
  // level 4: the architecture rules that hold in this region
  let ry = L.rulesY + 20;
  for (const lines of L.rulesLines) {
    lines.forEach((ln, i) => {
      el('text', { x: r.x + PAD + 6, y: ry + i * F.rule * 1.35, 'font-size': F.rule, fill: '#e3b341', 'font-style': 'italic' }, layer[4]).textContent = ln;
    });
    ry += lines.length * F.rule * 1.35 + 6;
  }
  return L.h;
}

// Place regions: top row (main, preload, renderer, projector), with "below" stacks, then native, then external.
const TOP = 160;
const heights = {};
for (const r of REGIONS) {
  if (r.row === 'native' || r.below) continue;
  heights[r.id] = drawRegion(r, TOP);
}
for (const r of REGIONS) {
  if (!r.below) continue;
  const above = rects[r.below];
  heights[r.id] = drawRegion(r, above.y + above.h + 50);
}
const topBottom = Math.max(...Object.values(rects).map((q) => q.y + q.h));
// Native sits under main + preload; the external world sits under everything.
const nat = REGIONS.find((r) => r.row === 'native');
const leftBottom = Math.max(rects.main.y + rects.main.h, rects.shared.y + rects.shared.h);
drawRegion(nat, leftBottom + 140);
// THE OUTSIDE WORLD — each box sits next to the process it talks to, so no edge crosses the map:
// files and control beside main, wire outputs and live senders under native, screens beside projectors.
const EXT_W = 560, EXT_H = 180;
const extPos = {};
['disk', 'osc', 'tablet', 'grafana'].forEach((id, i) => { extPos[id] = { x: -EXT_W - 180, y: rects.main.y + i * (EXT_H + 60) }; });
const underNative = rects.native.y + rects.native.h + 170;
['leds', 'usb', 'senders'].forEach((id, i) => { extPos[id] = { x: rects.native.x + 40 + i * (EXT_W + 60), y: underNative }; });
extPos.screens = { x: rects.projector.x + rects.projector.w + 180, y: rects.projector.y + 60 };
for (const e of EXTERNAL) {
  const { x, y } = extPos[e.id];
  rects[e.id] = { x, y, w: EXT_W, h: EXT_H };
  el('rect', { x, y, width: EXT_W, height: EXT_H, rx: 20, fill: '#121212', stroke: '#6a6a6a', 'stroke-width': 2.5, 'stroke-dasharray': '12 8' });
  el('text', { x: x + 24, y: y + 36, 'font-size': 20, fill: '#8a8a8a', 'letter-spacing': 3 }).textContent = 'OUTSIDE';
  el('text', { x: x + 24, y: y + 92, 'font-size': 44, 'font-weight': 650 }).textContent = e.t;
  el('text', { x: x + 24, y: y + 142, 'font-size': 30, fill: '#a8a8a8' }).textContent = e.s;
}
const extY = Math.max(...Object.values(rects).map((q) => q.y + q.h));   // bottom of everything, for the bounds

// ── Edges ──────────────────────────────────────────────────────────────────────────────────────
function anchor(r, toward) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const dx = toward.x - cx, dy = toward.y - cy;
  // exit through the side facing the other box
  if (Math.abs(dx) / r.w > Math.abs(dy) / r.h) return { x: dx > 0 ? r.x + r.w : r.x, y: Math.max(r.y + 60, Math.min(r.y + r.h - 60, toward.y)) };
  return { x: Math.max(r.x + 60, Math.min(r.x + r.w - 60, toward.x)), y: dy > 0 ? r.y + r.h : r.y };
}
const edgeGroups = { 1: el('g', {}, edgeLayer), 2: el('g', { class: 'lvl', 'data-lv': 2 }, edgeLayer) };
const defs = el('defs', {}, svg);
for (const k in KIND) {
  const m = el('marker', { id: 'ah-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: KIND[k] }, m);
}
for (const e of EDGES) {
  const A = rects[e.a], B = rects[e.b];
  if (!A || !B) continue;
  const ca = { x: A.x + A.w / 2, y: A.y + A.h / 2 }, cb = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
  let p = anchor(A, cb), q = anchor(B, ca);
  let mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2 + (e.bend || 0);
  if (e.route === 'under') {
    // Renderer → main without crossing the preload/shared column: leave the renderer low, pass UNDER
    // shared/, and enter main near its bottom-right corner.
    const gapY = rects.shared.y + rects.shared.h + 70;
    p = { x: A.x, y: Math.min(A.y + A.h - 60, gapY) };
    q = { x: B.x + B.w, y: B.y + B.h - 90 };
    mx = rects.preload.x + rects.preload.w / 2; my = gapY + 80;
  }
  const g = edgeGroups[e.lv] || edgeGroups[1];
  const path = el('path', { d: `M${p.x},${p.y} Q${mx},${my} ${q.x},${q.y}`, fill: 'none', stroke: KIND[e.kind], 'stroke-width': e.kind === 'out' ? 6 : 4,
    'stroke-dasharray': e.kind === 'ctl' ? '14 10' : 'none', 'marker-end': `url(#ah-${e.kind})`, opacity: .9 }, g);
  const lx = (p.x + 2 * mx + q.x) / 4, ly = (p.y + 2 * my + q.y) / 4;
  const t = el('text', { x: lx, y: ly, 'font-size': F.edge, 'text-anchor': 'middle', fill: KIND[e.kind], 'font-weight': 600, 'paint-order': 'stroke', stroke: '#0a0a0a', 'stroke-width': 10 }, g);
  t.textContent = e.label;
}

// ─────────────────────────────────────────────────────────────────────────────────────────────────
// CAMERA — pan/zoom; the zoom factor (relative to "fit") decides which levels are visible.
// ─────────────────────────────────────────────────────────────────────────────────────────────────
const allRects = Object.values(rects);
const bx0 = Math.min(...allRects.map((q) => q.x)) - 60, by0 = Math.min(...allRects.map((q) => q.y)) - 60;
const bounds = { x: bx0, y: by0, w: Math.max(...allRects.map((q) => q.x + q.w)) + 60 - bx0, h: extY + 60 - by0 };
let cam = { x: 0, y: 0, k: 1 }, fitK = 1;
const THRESH = { 2: 1.45, 3: 2.6, 4: 4.6 };   // zoom (× fit) at which each level is fully shown
function fit() {
  const W = innerWidth, H = innerHeight - 60;
  fitK = Math.min(W / bounds.w, H / bounds.h) * 0.96;
  cam = { k: fitK, x: (W - bounds.w * fitK) / 2 - bounds.x * fitK, y: 60 + (H - bounds.h * fitK) / 2 - bounds.y * fitK };
  apply();
}
function level() {
  const z = cam.k / fitK;
  return z >= THRESH[4] ? 4 : z >= THRESH[3] ? 3 : z >= THRESH[2] ? 2 : 1;
}
const NAMES = { 1: 'processes', 2: 'subsystems', 3: 'modules', 4: 'roles + rules' };
function apply() {
  world.setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.k})`);
  const z = cam.k / fitK;
  const fade = (lv) => { const t = THRESH[lv]; return Math.max(0, Math.min(1, (z - t * 0.72) / (t * 0.28))); };
  const show = (lv, o) => {
    for (const n of document.querySelectorAll(`.lvl[data-lv="${lv}"]`)) {
      n.setAttribute('opacity', o.toFixed(3));
      n.style.display = o <= 0.01 ? 'none' : '';
    }
  };
  show(1, 1 - fade(2));   // the summaries make way for the subsystem boxes
  for (const lv of [2, 3, 4]) show(lv, fade(lv));
  const L = level();
  document.getElementById('levelChip').innerHTML = `Level <b>${L}</b> of 4 · ${NAMES[L]}`;
  document.querySelectorAll('#levels button').forEach((b) => b.classList.toggle('on', +b.dataset.l === L));
}
function zoomAt(px, py, factor) {
  const k = Math.max(fitK * 0.6, Math.min(fitK * 14, cam.k * factor));
  const f = k / cam.k;
  cam.x = px - (px - cam.x) * f; cam.y = py - (py - cam.y) * f; cam.k = k;
  apply();
}
/** Animate the camera to show world rect r at zoom (× fit) z. */
function flyTo(cx, cy, z) {
  const from = { ...cam }, k = fitK * z;
  const to = { k, x: innerWidth / 2 - cx * k, y: (innerHeight + 60) / 2 - cy * k };
  const t0 = performance.now(), D = 420;
  (function step(now) {
    const t = Math.min(1, (now - t0) / D), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    cam = { k: from.k + (to.k - from.k) * e, x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    apply();
    if (t < 1) requestAnimationFrame(step);
  })(t0);
}

svg.addEventListener('wheel', (ev) => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0016)); }, { passive: false });
const pts = new Map(); let last = null, pinch = null;
svg.addEventListener('pointerdown', (ev) => { svg.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); svg.classList.add('dragging'); last = { x: ev.clientX, y: ev.clientY }; });
svg.addEventListener('pointermove', (ev) => {
  if (!pts.has(ev.pointerId)) return;
  pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinch) zoomAt(c.x, c.y, d / pinch);
    pinch = d; return;
  }
  if (last) { cam.x += ev.clientX - last.x; cam.y += ev.clientY - last.y; last = { x: ev.clientX, y: ev.clientY }; apply(); }
});
function up(ev) { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { last = null; svg.classList.remove('dragging'); } }
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
svg.addEventListener('dblclick', (ev) => zoomAt(ev.clientX, ev.clientY, 1.8));

const LEVEL_Z = { 1: 1, 2: 1.9, 3: 3.2, 4: 5.2 };
function jumpLevel(L) {
  const cx = (innerWidth / 2 - cam.x) / cam.k, cy = ((innerHeight + 60) / 2 - cam.y) / cam.k;
  if (L === 1) { fit(); return; }
  flyTo(cx, cy, LEVEL_Z[L]);
}
document.querySelectorAll('#levels button').forEach((b) => b.addEventListener('click', () => jumpLevel(+b.dataset.l)));
document.getElementById('fit').addEventListener('click', fit);
addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key >= '1' && ev.key <= '4') jumpLevel(+ev.key);
  if (ev.key === '0') fit();
  if (ev.key === '+' || ev.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  if (ev.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
});

// Search: zoom to the first module whose name contains the query; Enter again cycles matches.
let hits = [], hitI = 0, lastQ = '';
document.getElementById('q').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  const q = ev.target.value.trim().toLowerCase();
  if (!q) return;
  if (q !== lastQ) { hits = modIndex.filter((m) => m.name.includes(q)); hitI = 0; lastQ = q; } else hitI = (hitI + 1) % Math.max(1, hits.length);
  document.querySelectorAll('.hit').forEach((n) => n.classList.remove('hit'));
  const m = hits[hitI];
  if (!m) { ev.target.style.borderColor = '#e5484d'; return; }
  ev.target.style.borderColor = '';
  m.g.classList.add('hit');
  flyTo(m.x + m.w / 2, m.y + m.h / 2, LEVEL_Z[4]);
});

addEventListener('resize', fit);
fit();
</script>
</body>
</html>
