[package]
name = "artlux-engine"
version = "0.0.1"
edition = "2021"
publish = false
description = "ArtLux native render engine (E0 skeleton)"

[dependencies]
# PINNED EXACTLY (plan §8 risk 4): the zero-copy imports lean on wgpu-hal APIs that are not stable
# across releases. A bump is a deliberate change with its own spike, never a `cargo update`.
wgpu = "=30.0.2"
pollster = "1.0.3"
# Engine windows (E0b). 0.30 is the stable line; 0.31 is still in beta.
winit = "0.30.13"
# HAP (E0d): the app's own parsers (native/hap/src/{mov,hap}.rs) need Snappy; texture2ddecoder is the
# CPU decode the GPU's BC sampling is held to, and the fallback where an adapter has no BC.
snap = "1"
texture2ddecoder = "0.1"
# The document the host sends (E1b on): JSON, as the rest of ArtLux speaks it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fdlibm-derived cos/sin/log2: the LED layout must match V8's Math.cos/sin/log2 to the bit (E1b-2).
libm = "0.2"
# Atlas / buffer payloads in the parity batches.
base64 = "0.22"
# E1d: still images (PNG / JPEG) decoded in the engine.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# E1c: the app's own Art-Net / sACN / USB send thread, linked without Node (its "napi" feature off).
artlux-output-engine = { path = "../../native/output-engine", default-features = false }

# E0c: D3D12 shared textures + handle duplication. The SAME `windows` line wgpu-hal 30 uses (0.62), so
# its ID3D12Device and ours are one type.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Threading",
] }
# E0d: Spout's own library (the same crate the app's receiver uses), for a REAL sender and the sender
# registry. Not the receive path's pixels: those come from the sender's texture on the GPU.
spout2 = { package = "spout2-rs", version = "0.1.1", default-features = false, features = ["dx"] }
