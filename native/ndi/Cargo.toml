[package]
name = "artlux-ndi"
version = "0.0.0"
edition = "2021"
description = "Native NDI receive + send for ArtLux (napi-rs)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

# The real NDI implementation links the NDI 6 SDK at build time. Gate it behind the `ndi`
# feature so the crate still compiles to no-op stubs on machines without the SDK (this dev
# sandbox + SDK-less CI), mirroring how spout-receiver stubs on non-Windows. Build the real
# addon with: cargo build --release --features ndi  (requires NDI_SDK_DIR set).
grafton-ndi = { version = "1", optional = true }

[features]
default = []
ndi = ["grafton-ndi"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
