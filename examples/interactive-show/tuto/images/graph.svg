<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="gr-arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8.5,4.5 L1,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="gr-arrow-dim" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8.5,4.5 L1,8 Z" fill="#f3f4f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="440" rx="12" fill="#14171d" stroke="#2b3140" stroke-width="1"/>
  <text x="34" y="42" fill="#f3f4f6" font-size="19px" font-weight="600">The show — four states and one branch</text>
  <text x="34" y="66" fill="#f3f4f6" font-size="13px">Every arrow is a LiDAR zone rule. The way back is one global rule, so it is not drawn as an arrow.</text>

  <!-- transitions -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <line x1="170" y1="220" x2="318" y2="220" marker-end="url(#gr-arrow)"/>
    <line x1="410" y1="200" x2="566" y2="138" marker-end="url(#gr-arrow)"/>
    <line x1="410" y1="240" x2="566" y2="302" marker-end="url(#gr-arrow)"/>
  </g>
  <g>
    <rect x="160" y="188" width="168" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="244" y="203" text-anchor="middle" fill="#f3f4f6" font-size="12px" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace">Entrance: enters</text>
    <rect x="350" y="124" width="150" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="425" y="139" text-anchor="middle" fill="#f3f4f6" font-size="12px" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace">Left pad: 1.5 s</text>
    <rect x="350" y="294" width="150" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="425" y="309" text-anchor="middle" fill="#f3f4f6" font-size="12px" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace">Right pad: 1.5 s</text>
  </g>

  <!-- states -->
  <g>
    <circle cx="120" cy="220" r="48" fill="#0e3a44" stroke="#22d3ee" stroke-width="3"/>
    <text x="120" y="225" text-anchor="middle" fill="#f3f4f6" font-size="15px" font-weight="600">Attract</text>
    <circle cx="364" cy="220" r="44" fill="#3a2a0e" stroke="#f59e0b" stroke-width="2"/>
    <text x="364" y="225" text-anchor="middle" fill="#f3f4f6" font-size="15px" font-weight="600">Welcome</text>
    <circle cx="612" cy="120" r="44" fill="#0b3a2c" stroke="#10b981" stroke-width="2"/>
    <text x="612" y="125" text-anchor="middle" fill="#f3f4f6" font-size="15px" font-weight="600">Story A</text>
    <circle cx="612" cy="320" r="44" fill="#3a1240" stroke="#d946ef" stroke-width="2"/>
    <text x="612" y="325" text-anchor="middle" fill="#f3f4f6" font-size="15px" font-weight="600">Story B</text>
  </g>
  <text x="120" y="290" text-anchor="middle" fill="#f3f4f6" font-size="12.5px">initial state</text>

  <!-- the global rule, drawn as a legend rather than an edge -->
  <rect x="34" y="370" width="712" height="46" rx="8" fill="#171b22" stroke="#2b3140"/>
  <text x="50" y="390" fill="#f3f4f6" font-size="12.5px">⚡ Global rule, from any state → Attract:</text>
  <text x="50" y="407" fill="#f3f4f6" font-size="12px" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace">ALL of  Entrance ⌀6s  ∧  Left pad ⌀6s  ∧  Right pad ⌀6s   (every zone empty for 6 s)</text>
</svg>
