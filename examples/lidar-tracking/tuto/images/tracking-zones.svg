<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="tz-blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <marker id="tz-ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { fill: #e8ebf0; font-size: 19px; font-weight: 600; }
      .sub   { fill: #93a0b3; font-size: 13px; }
      .zname { fill: #6ee7b7; font-size: 15px; font-weight: 600; }
      .zsub  { fill: #7f9c93; font-size: 11.5px; }
      .dim   { fill: #b9c4d0; font-size: 12px; font-family: ui-monospace, 'Consolas', monospace; }
      .uv    { fill: #fcd34d; font-size: 12.5px; font-weight: 600; font-family: ui-monospace, monospace; }
      .bid   { fill: #fde68a; font-size: 11px; font-family: ui-monospace, monospace; }
      .note  { fill: #93a0b3; font-size: 12px; }
      .zedge { fill: none; stroke: #34d399; stroke-opacity: .55; stroke-width: 1.6; }
      .zgrid { fill: none; stroke: #34d399; stroke-opacity: .18; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="430" rx="12" fill="#14171d" stroke="#2b3140" stroke-width="1"/>
  <text x="34" y="40" class="title">The tracking zones in 3D — SOL floor + MUR wall</text>
  <text x="34" y="64" class="sub">Both zones are 5.825 × 3.125 m and share their bottom edge. Markers are smoothed blobs (one per tracked person).</text>

  <!-- MUR wall (frontal, z = 0) -->
  <polygon points="250,110 560,110 560,238 250,238" fill="#0e1a17" fill-opacity="0.7" class="zedge"/>
  <g class="zgrid">
    <line x1="327.5" y1="110" x2="327.5" y2="238"/><line x1="405" y1="110" x2="405" y2="238"/><line x1="482.5" y1="110" x2="482.5" y2="238"/>
    <line x1="250" y1="153" x2="560" y2="153"/><line x1="250" y1="196" x2="560" y2="196"/>
  </g>

  <!-- SOL floor (parallelogram receding, y = 0) -->
  <polygon points="250,238 560,238 620,342 190,342" fill="#0e1a17" fill-opacity="0.8" class="zedge"/>
  <g class="zgrid">
    <line x1="230" y1="272" x2="580" y2="272"/><line x1="210" y1="307" x2="600" y2="307"/>
    <line x1="327.5" y1="238" x2="297.5" y2="342"/><line x1="405" y1="238" x2="405" y2="342"/><line x1="482.5" y1="238" x2="512.5" y2="342"/>
  </g>

  <!-- shared bottom edge, brightened -->
  <line x1="250" y1="238" x2="560" y2="238" stroke="#6ee7b7" stroke-width="2.4"/>
  <text x="572" y="235" class="zsub" fill="#6ee7b7">shared edge</text>

  <!-- zone names -->
  <text x="405" y="150" text-anchor="middle" class="zname">MUR — wall</text>
  <text x="405" y="168" text-anchor="middle" class="zsub">z = 0 (vertical)</text>
  <text x="405" y="300" text-anchor="middle" class="zname">SOL — floor</text>
  <text x="405" y="318" text-anchor="middle" class="zsub">y = 0 (ground)</text>

  <!-- blob markers on the floor -->
  <g>
    <circle cx="355" cy="285" r="19" fill="url(#tz-blob)"/><circle cx="355" cy="285" r="3.5" fill="#fffbeb"/>
    <text x="355" y="264" text-anchor="middle" class="bid">id 1</text>
    <circle cx="470" cy="300" r="19" fill="url(#tz-blob)"/><circle cx="470" cy="300" r="3.5" fill="#fffbeb"/>
    <text x="470" y="279" text-anchor="middle" class="bid">id 2</text>
  </g>

  <!-- U/V gizmo at the floor's near-left origin -->
  <g>
    <circle cx="205" cy="330" r="3.6" fill="#fcd34d"/>
    <line x1="205" y1="330" x2="285" y2="330" stroke="#fcd34d" stroke-width="1.8" marker-end="url(#tz-ar)"/>
    <text x="292" y="334" class="uv">U</text>
    <line x1="205" y1="330" x2="243" y2="266" stroke="#fcd34d" stroke-width="1.8" marker-end="url(#tz-ar)"/>
    <text x="246" y="262" class="uv">V</text>
    <text x="205" y="356" text-anchor="middle" class="zsub" fill="#fcd34d">origin 0,0</text>
  </g>

  <!-- dimensions -->
  <text x="405" y="362" text-anchor="middle" class="dim">5.825 m (width, +U)</text>
  <text x="628" y="180" class="dim">3.125 m</text>
  <text x="628" y="196" class="zsub">height / depth (+V)</text>

  <!-- note -->
  <text x="34" y="408" class="note">3D Scene ▸ Lighting ▸ Tracking zones (LiDAR) — the smoothed view (One-Euro filter + prediction), not the raw 2D Stage.</text>
</svg>
