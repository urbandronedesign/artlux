<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="sg-arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8.5,4.5 L1,8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { fill: #e8ebf0; font-size: 19px; font-weight: 600; }
      .sub   { fill: #93a0b3; font-size: 13px; }
      .nname { fill: #f3f4f6; font-size: 16px; font-weight: 600; }
      .ntag  { fill: #9aa7ba; font-size: 11.5px; }
      .chip  { fill: #cdd6e3; font-size: 12px; font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace; }
      .leg   { fill: #93a0b3; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="410" rx="12" fill="#14171d" stroke="#2b3140" stroke-width="1"/>
  <text x="34" y="42" class="title">The state graph — three looks in a loop</text>
  <text x="34" y="66" class="sub">Each node is a State bound to a Scene (a look). Arrows are triggered transitions that recall the next look.</text>

  <!-- transitions (drawn first, nodes overlay their ends) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <line x1="250" y1="170" x2="530" y2="170" marker-end="url(#sg-arrow)"/>
    <line x1="540.7" y1="201" x2="429.3" y2="289" marker-end="url(#sg-arrow)"/>
    <line x1="350.7" y1="289" x2="239.3" y2="201" marker-end="url(#sg-arrow)"/>
  </g>
  <!-- transition label chips (sit on the arrow midpoints) -->
  <g>
    <rect x="293" y="159" width="194" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="390" y="174" text-anchor="middle" class="chip">afterDelay 6s · xfade 2s</text>
    <rect x="388" y="234" width="194" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="485" y="249" text-anchor="middle" class="chip">afterDelay 6s · xfade 3s</text>
    <rect x="198" y="234" width="194" height="22" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="295" y="249" text-anchor="middle" class="chip">afterDelay 8s · xfade 2s</text>
  </g>

  <!-- CALM (initial → cyan) -->
  <g>
    <circle cx="200" cy="170" r="50" fill="#1b2230" stroke="#22d3ee" stroke-width="3"/>
    <g transform="translate(189,131)" fill="none" stroke="#7fd7e6" stroke-width="1.3">
      <rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/>
    </g>
    <text x="200" y="174" text-anchor="middle" class="nname">Calm</text>
    <text x="200" y="193" text-anchor="middle" class="ntag">Ocean · dim</text>
  </g>
  <!-- RISE (current/live → orange ring) -->
  <g>
    <circle cx="580" cy="170" r="57" fill="none" stroke="#fb923c" stroke-width="3"/>
    <circle cx="580" cy="170" r="50" fill="#1b2230" stroke="#475569" stroke-width="2.5"/>
    <g transform="translate(569,131)" fill="none" stroke="#cbd5e1" stroke-width="1.3">
      <rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/>
    </g>
    <text x="580" y="174" text-anchor="middle" class="nname">Rise</text>
    <text x="580" y="193" text-anchor="middle" class="ntag">Rainbow · med</text>
  </g>
  <!-- BURN -->
  <g>
    <circle cx="390" cy="320" r="50" fill="#1b2230" stroke="#475569" stroke-width="2.5"/>
    <g transform="translate(379,281)" fill="none" stroke="#cbd5e1" stroke-width="1.3">
      <rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/>
    </g>
    <text x="390" y="324" text-anchor="middle" class="nname">Burn</text>
    <text x="390" y="343" text-anchor="middle" class="ntag">Lava · bright</text>
  </g>

  <!-- legend -->
  <g transform="translate(60,390)">
    <circle cx="8" cy="-4" r="7" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="22" y="0" class="leg">initial state</text>
    <circle cx="152" cy="-4" r="7" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <text x="166" y="0" class="leg">current / live</text>
    <line x1="312" y1="-4" x2="340" y2="-4" stroke="#7dd3fc" stroke-width="2" marker-end="url(#sg-arrow)"/>
    <text x="350" y="0" class="leg">transition — trigger · crossfade</text>
  </g>
</svg>
