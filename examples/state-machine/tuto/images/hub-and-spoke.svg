<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="hs-cyan" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8.5,4.5 L1,8 Z" fill="#67e8f9"/>
    </marker>
    <marker id="hs-amber" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8.5,4.5 L1,8 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { fill: #e8ebf0; font-size: 19px; font-weight: 600; }
      .sub   { fill: #93a0b3; font-size: 13px; }
      .nname { fill: #f3f4f6; font-size: 15.5px; font-weight: 600; }
      .hname { fill: #f3f4f6; font-size: 18px; font-weight: 600; }
      .htag  { fill: #7fd7e6; font-size: 12px; }
      .tag   { fill: #9aa7ba; font-size: 11.5px; }
      .chip  { fill: #cdd6e3; font-size: 11.5px; font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace; }
      .leg   { fill: #93a0b3; font-size: 12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="470" rx="12" fill="#14171d" stroke="#2b3140" stroke-width="1"/>
  <text x="34" y="40" class="title">Hub-and-spoke — an attract loop with triggered performances</text>
  <text x="34" y="64" class="sub">Attract is the unattended hub. A manual trigger fans out to a performance; each performance returns to Attract on its own.</text>

  <!-- connections (drawn first) -->
  <g stroke="#3f4b5b" stroke-width="2">
    <line x1="332.85" y1="225.99" x2="190.72" y2="166.27" marker-start="url(#hs-amber)" marker-end="url(#hs-cyan)"/>
    <line x1="447.15" y1="225.99" x2="589.28" y2="166.27" marker-start="url(#hs-amber)" marker-end="url(#hs-cyan)"/>
    <line x1="333.72" y1="276.01" x2="190.12" y2="342.38" marker-start="url(#hs-amber)" marker-end="url(#hs-cyan)"/>
    <line x1="446.28" y1="276.01" x2="589.88" y2="342.38" marker-start="url(#hs-cyan)" marker-end="url(#hs-cyan)"/>
  </g>
  <!-- edge chips at midpoints -->
  <g>
    <rect x="196" y="185" width="132" height="21" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="262" y="199.5" text-anchor="middle" class="chip">auto-return 10s</text>
    <rect x="452" y="185" width="132" height="21" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="518" y="199.5" text-anchor="middle" class="chip">auto-return 10s</text>
    <rect x="196" y="298" width="132" height="21" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="262" y="312.5" text-anchor="middle" class="chip">auto-return 10s</text>
    <rect x="450" y="298" width="136" height="21" rx="6" fill="#171b22" stroke="#2b3140"/>
    <text x="518" y="312.5" text-anchor="middle" class="chip">held · manual return</text>
  </g>

  <!-- HUB: Attract -->
  <g>
    <circle cx="390" cy="250" r="62" fill="#1b2230" stroke="#22d3ee" stroke-width="3"/>
    <g transform="translate(379,207)" fill="none" stroke="#7fd7e6" stroke-width="1.3">
      <rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/>
    </g>
    <text x="390" y="250" text-anchor="middle" class="hname">Attract</text>
    <text x="390" y="271" text-anchor="middle" class="htag">initial · self-loops</text>
  </g>

  <!-- spokes -->
  <g>
    <circle cx="152" cy="150" r="42" fill="#1b2230" stroke="#f97316" stroke-width="2.5"/>
    <g transform="translate(141,116)" fill="none" stroke="#f9a86a" stroke-width="1.3"><rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/></g>
    <text x="152" y="155" text-anchor="middle" class="nname">Ember</text>
    <text x="152" y="212" text-anchor="middle" class="tag">lock 3s</text>
  </g>
  <g>
    <circle cx="628" cy="150" r="42" fill="#1b2230" stroke="#38bdf8" stroke-width="2.5"/>
    <g transform="translate(617,116)" fill="none" stroke="#8ad3f7" stroke-width="1.3"><rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/></g>
    <text x="628" y="155" text-anchor="middle" class="nname">Tide</text>
    <text x="628" y="212" text-anchor="middle" class="tag">lock 3s</text>
  </g>
  <g>
    <circle cx="152" cy="360" r="42" fill="#1b2230" stroke="#4ade80" stroke-width="2.5"/>
    <g transform="translate(141,326)" fill="none" stroke="#86efac" stroke-width="1.3"><rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/></g>
    <text x="152" y="365" text-anchor="middle" class="nname">Grove</text>
    <text x="152" y="422" text-anchor="middle" class="tag">lock 3s</text>
  </g>
  <g>
    <circle cx="628" cy="360" r="42" fill="#0a0c10" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
    <g transform="translate(617,326)" fill="none" stroke="#64748b" stroke-width="1.3"><rect x="0" y="0" width="22" height="14" rx="2"/><line x1="5.5" y1="0" x2="5.5" y2="14"/><line x1="16.5" y1="0" x2="16.5" y2="14"/></g>
    <text x="628" y="365" text-anchor="middle" class="nname" fill="#cbd5e1">Blackout</text>
    <text x="628" y="422" text-anchor="middle" class="tag">brightness 0</text>
  </g>

  <!-- legend -->
  <g transform="translate(50,450)">
    <line x1="0" y1="-4" x2="28" y2="-4" stroke="#3f4b5b" stroke-width="2" marker-end="url(#hs-cyan)"/>
    <text x="38" y="0" class="leg">manual trigger → performance</text>
    <line x1="300" y1="-4" x2="328" y2="-4" stroke="#3f4b5b" stroke-width="2" marker-end="url(#hs-amber)"/>
    <text x="338" y="0" class="leg">afterDelay auto-return</text>
    <text x="560" y="0" class="leg">Blackout is held (manual release)</text>
  </g>
</svg>
