# Local ArtLux monitoring stack: Prometheus + Grafana, both on localhost.
#   cd monitoring && docker compose up -d
# Then open Grafana at http://localhost:3001 (admin / admin) — the ArtLux
# dashboard and Prometheus datasource are auto-provisioned.
# Prometheus UI is at http://localhost:9090.
#
# Launch ArtLux first with the endpoint reachable from the containers:
#   PowerShell:  $env:ARTLUX_METRICS_HOST = "0.0.0.0"; npm run dev
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: artlux-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; no-op/already present on Docker Desktop

  grafana:
    image: grafana/grafana:latest
    container_name: artlux-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # 3001 on the host so it doesn't clash with the Vite dev server (3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
