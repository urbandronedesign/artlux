name: Engine
# THE NATIVE ENGINE, on Windows — the only platform it ships on (the owner, 2026-11-26: "we will use only windows
# for our shows; mac and linux can stay on the old technology"). macOS and Linux run the BROWSER engine, which is
# not built here; build.yml never builds the engine for them either (its step is Windows-only and the binary is
# only in build.win.extraResources). Until 2026-11-25 this ran on all three runners (plans/native-engine.md §6b);
# the engine stopped compiling off Windows with E6a (its video encoder is Media Foundation), and keeping those
# jobs would only keep a red cross on every push. Guarded by verify:invariants.
#
# The hosted runner has NO GPU, so the engine runs on WARP (D3D12's software adapter). Two claims:
#   1. the engine REFUSES a software adapter by default — a venue machine must never run a show on a
#      CPU rasterizer by accident;
#   2. with software allowed, the offscreen render and the LED sampling match the committed goldens
#      BYTE FOR BYTE — the same goldens a hardware GPU matches.
# Performance is never judged here; that stays on the RTX PC.
#
# Its own workflow, not a job in build.yml: build.yml packages installers on release tags only, and the
# engine is tested on every push that touches it.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ matrix.os }}-engine-${{ hashFiles('engine/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --manifest-path engine/Cargo.toml -p artlux-engine

      - name: Adapters on this runner
        run: engine/target/release/artlux-engine --info

      - name: A software adapter is refused by default
        run: |
          set +e
          engine/target/release/artlux-engine --selftest
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::expected the engine to refuse the software adapter (exit 2), got exit $code"
            exit 1
          fi
          echo "refused, as it must be"

      - name: Self-test against the goldens (software allowed)
        run: engine/target/release/artlux-engine --selftest --allow-software

      - name: cargo test
        run: cargo test --release --locked --manifest-path engine/Cargo.toml -p artlux-engine -- --nocapture
