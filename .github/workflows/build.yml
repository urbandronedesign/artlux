name: Build

# Per-platform native prebuilds + packaged apps. Each OS runner builds the Rust
# napi addon natively (so the bundled output-engine.node matches the platform)
# and produces an installer via electron-builder.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/output-engine/target
            native/spout-receiver/target
            native/ndi/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('native/output-engine/Cargo.lock', 'native/spout-receiver/Cargo.lock', 'native/ndi/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # NDI: native/ndi/ndi.node is a committed prebuilt (Windows, built against the NDI SDK),
      # so CI doesn't build it — build:native covers output-engine + spout only.
      - name: Build native engine
        run: npm run build:native

      - name: Build app (main/preload/renderer)
        run: npm run build

      - name: Package
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing in CI (unsigned artifacts).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artlux-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
          if-no-files-found: ignore

  # Publish a GitHub Release with the installers when building a v* tag.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
