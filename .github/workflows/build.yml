name: Build

# Per-platform native prebuilds + packaged apps. Each OS runner builds the Rust
# napi addon natively (so the bundled output-engine.node matches the platform)
# and produces an installer via electron-builder.
#
# It also builds the C++ JUCE audio engine (native/audio-engine) on each runner — see the
# "Build audio engine" step. That build is MANDATORY here: plugins/audio graceful-degrades when
# the addon is missing, so a release cut without it would ship a full audio UI that makes NO SOUND,
# silently. If the audio engine fails to build, the release must fail with it.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/output-engine/target
            native/spout-receiver/target
            native/ndi/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('native/output-engine/Cargo.lock', 'native/spout-receiver/Cargo.lock', 'native/ndi/Cargo.lock') }}

      # JUCE's Linux build needs ALSA (juce_audio_devices) and the X11 dev headers that juce_core /
      # juce_events reference. CMake (3.31) and GCC are already on the ubuntu image; Windows
      # (CMake + MSVC v143) and macOS (CMake + Apple Clang) images need nothing extra.
      # Not needed: libcurl (JUCE_USE_CURL=0) or webkit (JUCE_WEB_BROWSER=0) — see CMakeLists.txt.
      # ...and `libudev-dev`, which is NOT for JUCE: the output engine gained a `serialport` dependency
      # with USB-DMX (ENTTEC) support, and on Linux that pulls `libudev-sys`, whose build script shells
      # out to pkg-config for `libudev.pc` and panics without it. Missing it fails `cargo build` outright
      # (exit 101) rather than degrading, so the Linux package job cannot even start. This broke the
      # moment USB-DMX landed and stayed invisible until the next tag, because nothing between those two
      # commits was released.
      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev \
            libudev-dev pkg-config

      - name: Install dependencies
        run: npm ci

      # MediaPipe ships its WASM runtime + BlazePose models out of band: @mediapipe/tasks-vision would
      # otherwise fetch them from a Google CDN per session, which Electron's CSP blocks. Vite copies
      # them out of the renderer public dir at build time, so this MUST run before "Build app" or the
      # packaged renderer has no pose assets and camera tracking silently does nothing.
      - name: Stage MediaPipe offline assets
        run: npm run assets:mediapipe

      # The two Windows redistributables the NSIS installer bundles and silently installs (NDI Runtime,
      # VC++ 2015-2022), plus the stock OpenCV world DLL that calib.node links.
      #
      # This step is why calibration and NDI were dead in released builds: all three are gitignored, CI
      # never ran build:calib (it needs OpenCV + LLVM + MSVC, which no runner has), and electron-builder
      # resolves an extraResources `from` as a GLOB -- a literal path matching nothing is a SILENT skip,
      # not an error. So every release shipped calib.node with no OpenCV behind it and an installer that
      # could not install the NDI Runtime. Fetching the unmodified redistributables needs no toolchain.
      - name: Stage Windows redistributables + OpenCV runtime
        if: runner.os == 'Windows'
        run: npm run fetch:redist && npm run fetch:opencv

      # NDI: native/ndi/ndi.node is a committed prebuilt (Windows, built against the NDI SDK),
      # so CI doesn't build it — build:native covers output-engine + spout + hap only.
      - name: Build native engine
        run: npm run build:native

      # The JUCE audio engine, built STRICTLY (build:native only warns, so it cannot be relied on to
      # fail the job). This compiles native/audio-engine with cmake-js and copies the addon to
      # native/audio-engine/audio_engine.node, which electron-builder ships as `audio-engine.node`.
      # It also installs native/audio-engine's own deps: that dir is not an npm workspace, so the
      # root `npm ci` above does NOT provide cmake-js / node-addon-api.
      - name: Build audio engine (JUCE)
        run: npm run build:audio

      # Licence gate on the ARTEFACT, not on the environment that produced it. It matters HERE and not
      # only in `npm run package`, because this workflow does not use that script -- it runs the same
      # steps by hand, so anything wired only into `package` never protects a release. CI does not set
      # ARTLUX_ASIO_SDK today, which makes this a no-op; that is the point. It stays a no-op instead of
      # becoming an unlicensed publish the first time someone adds the variable to repository secrets.
      - name: Verify ASIO licence position
        run: npm run verify:asio

      - name: Build app (main/preload/renderer)
        run: npm run build

      # Hard gate: assert every file electron-builder is DECLARED to bundle actually exists, because
      # electron-builder itself will not. Without this the job stays green while producing an installer
      # that is missing native runtimes -- the failure then surfaces on the venue PC, silently.
      - name: Verify packaged resources
        run: npm run verify:resources

      - name: Package
        run: npx electron-builder --publish never
        env:
          # No Developer ID in CI -- do not let electron-builder hunt the keychain for one. macOS
          # artifacts are still AD-HOC signed (package.json `mac.identity: "-"`), which is not a
          # nicety: an arm64 Mach-O must carry a valid signature to execute at all. They are not
          # notarized, so first launch needs the Gatekeeper bypass documented in README.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hard gate: assert the packed .app has a VALID signature. On Apple Silicon an *invalid*
      # signature is fatal -- the kernel will not map the binary and Gatekeeper reports "ArtLux is
      # damaged and can't be opened", which `xattr -dr com.apple.quarantine` does NOT fix. That shipped
      # from v0.19.1 to v0.25.4: the fuse flip rewrites the Electron binary AFTER afterPack, so the
      # ad-hoc signature the old hook applied there was invalidated, and with no Developer ID nothing
      # re-signed. Every mac dmg was DOA and this job stayed green. It cannot stay green now.
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: npm run verify:macsign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artlux-${{ matrix.os }}
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
          if-no-files-found: ignore

  # Publish a GitHub Release with the installers when building a v* tag.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
