name: Build

# Per-platform native prebuilds + packaged apps. Each OS runner builds the Rust
# napi addon natively (so the bundled output-engine.node matches the platform)
# and produces an installer via electron-builder.
#
# It also builds the C++ JUCE audio engine (native/audio-engine) on each runner — see the
# "Build audio engine" step. That build is MANDATORY here: plugins/audio graceful-degrades when
# the addon is missing, so a release cut without it would ship a full audio UI that makes NO SOUND,
# silently. If the audio engine fails to build, the release must fail with it.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/output-engine/target
            native/spout-receiver/target
            native/ndi/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('native/output-engine/Cargo.lock', 'native/spout-receiver/Cargo.lock', 'native/ndi/Cargo.lock') }}

      # JUCE's Linux build needs ALSA (juce_audio_devices) and the X11 dev headers that juce_core /
      # juce_events reference. CMake (3.31) and GCC are already on the ubuntu image; Windows
      # (CMake + MSVC v143) and macOS (CMake + Apple Clang) images need nothing extra.
      # Not needed: libcurl (JUCE_USE_CURL=0) or webkit (JUCE_WEB_BROWSER=0) — see CMakeLists.txt.
      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev

      - name: Install dependencies
        run: npm ci

      # NDI: native/ndi/ndi.node is a committed prebuilt (Windows, built against the NDI SDK),
      # so CI doesn't build it — build:native covers output-engine + spout + hap only.
      - name: Build native engine
        run: npm run build:native

      # The JUCE audio engine, built STRICTLY (build:native only warns, so it cannot be relied on to
      # fail the job). This compiles native/audio-engine with cmake-js and copies the addon to
      # native/audio-engine/audio_engine.node, which electron-builder ships as `audio-engine.node`.
      # It also installs native/audio-engine's own deps: that dir is not an npm workspace, so the
      # root `npm ci` above does NOT provide cmake-js / node-addon-api.
      - name: Build audio engine (JUCE)
        run: npm run build:audio

      - name: Build app (main/preload/renderer)
        run: npm run build

      - name: Package
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing in CI (unsigned artifacts).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artlux-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
          if-no-files-found: ignore

  # Publish a GitHub Release with the installers when building a v* tag.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
