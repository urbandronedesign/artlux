name: Build

# Per-platform native prebuilds + packaged apps. Each OS runner builds the Rust
# napi addon natively (so the bundled output-engine.node matches the platform)
# and produces an installer via electron-builder.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/output-engine/target
            native/spout-receiver/target
            native/ndi/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('native/output-engine/Cargo.lock', 'native/spout-receiver/Cargo.lock', 'native/ndi/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Build the REAL NDI addon on Windows when an NDI SDK installer URL is provided
      # (secret NDI_SDK_URL). LLVM/libclang is preinstalled on the runner. Without the
      # secret this is a no-op and the NDI crate builds as a stub via build:native below.
      - name: Configure NDI build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          NDI_SDK_URL: ${{ secrets.NDI_SDK_URL }}
        run: |
          if ($env:NDI_SDK_URL) {
            Write-Host "Installing NDI SDK for a real NDI build..."
            $exe = "$env:RUNNER_TEMP\ndi_sdk.exe"
            Invoke-WebRequest -Uri $env:NDI_SDK_URL -OutFile $exe
            Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            "NDI_SDK_DIR=C:\Program Files\NDI\NDI 6 SDK" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            if (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll') {
              "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
            "NATIVE_BUILD=build:ndi" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Configured real NDI build (build:ndi)."
          } else {
            Write-Host "NDI_SDK_URL not set - NDI builds as a stub."
          }

      - name: Build native engine
        shell: bash
        run: npm run ${NATIVE_BUILD:-build:native}

      - name: Build app (main/preload/renderer)
        run: npm run build

      - name: Package
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing in CI (unsigned artifacts).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artlux-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
          if-no-files-found: ignore

  # Publish a GitHub Release with the installers when building a v* tag.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
